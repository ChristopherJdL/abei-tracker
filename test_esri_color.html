<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #071f2e; color: white; font-family: sans-serif; display: flex; flex-wrap: wrap; }
    .box { margin: 10px; text-align: center; }
    img { width: 256px; height: 256px; }
    .filter-1 { filter: sepia(1) hue-rotate(180deg) saturate(2.5) brightness(0.9) contrast(1.2); }
    .filter-2 { filter: sepia(1) hue-rotate(160deg) saturate(3) brightness(0.8) contrast(1.3); }
    .filter-3 { filter: sepia(1) hue-rotate(190deg) saturate(2) brightness(1) contrast(1.5); }
    .filter-4 { filter: invert(1) sepia(1) hue-rotate(170deg) saturate(3) brightness(0.4); } /* Esri Light Gray inverted */
  </style>
</head>
<body>
  <div class="box">
    <p>Native Dark Gray</p>
    <img src="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/4/5/7" />
  </div>
  <div class="box">
    <p>Filter 1 (Dark Blue)</p>
    <img class="filter-1" src="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/4/5/7" />
  </div>
  <div class="box">
    <p>Filter 2 (Teal)</p>
    <img class="filter-2" src="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/4/5/7" />
  </div>
  <div class="box">
    <p>Filter 3 (Navy)</p>
    <img class="filter-3" src="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/4/5/7" />
  </div>
  <div class="box">
    <p>Light Gray Inverted</p>
    <img class="filter-4" src="https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/4/5/7" />
  </div>
</body>
</html>
